<script type="application/json" id="data" data-own>{"posts": [{"id": "fuel01", "type": "article", "title": "তেলের দাম বাড়ার পর বাসভাড়ায় অস্থিরতা: সরকারি হারের চেয়ে বেশি ভাড়ায় ভোগান্তিতে যাত্রীরা", "cat": "Recent Situation", "author": "Rafsan", "summary": "জ্বালানির দাম লিটারে ২০ টাকা বাড়ার পর সরকার ভাড়া বাড়ায় কিলোমিটারে ১৭ পয়সা। কিন্তু অনেক রুটে যাত্রীদের কাছ থেকে তার চেয়ে বেশি আদায়ের অভিযোগ উঠেছে।", "body": "সেপ্টেম্বরের তৃতীয় সপ্তাহে সরকার ডিজেল, কেরোসিন, অকটেন ও পেট্রোলের দাম লিটারপ্রতি ২০ টাকা বাড়ানোর পর সারা দেশে বাসভাড়া নিয়ে অস্থিরতা তৈরি হয়েছে। সরকার নতুন ভাড়া নির্ধারণ করলেও অনেক রুটে যাত্রীদের কাছ থেকে তার চেয়ে বেশি টাকা আদায়ের অভিযোগ উঠেছে।\n\n## সরকারি হার কত\n- তেলের দাম বাড়ার পর বাংলাদেশ সড়ক পরিবহন কর্তৃপক্ষ (বিআরটিএ) কিলোমিটারপ্রতি ২০ পয়সা ভাড়া বাড়ানোর প্রস্তাব দেয়।\n- ২২ সেপ্টেম্বর সড়ক পরিবহন ও সেতুমন্ত্রীর সঙ্গে বৈঠকের পর পরিবহন মালিকদের সঙ্গে কিলোমিটারপ্রতি ১৭ পয়সা বাড়ানোর বিষয়ে সমঝোতা হয়।\n- নতুন হারে ঢাকা ও চট্টগ্রাম মহানগরে বাস-মিনিবাসের ভাড়া কিলোমিটারপ্রতি ২ টাকা ৫৩ পয়সা থেকে বেড়ে ২ টাকা ৭০ পয়সা হয়েছে। দূরপাল্লায় ২ টাকা ২৩ পয়সা থেকে বেড়ে ২ টাকা ৪০ পয়সা।\n\n## মাঠের চিত্র\nঢাকা ট্রিবিউনের প্রতিবেদন অনুযায়ী, সরকার ভাড়া নির্ধারণের পরও ঢাকার অনেক রুটে ৫ থেকে ২০ টাকা পর্যন্ত বেশি ভাড়া নেওয়ার অভিযোগ এসেছে। দূরপাল্লার কিছু রুটে যাত্রীরা ৫০ থেকে ১০০ টাকা বেশি দিতে হচ্ছে বলে জানিয়েছেন। একটি উদাহরণে, মোহাম্মদপুরের রিং রোড থেকে আব্দুল্লাহপুরগামী একটি বাসে ৫০ টাকা নেওয়া হয়েছে, যেখানে নতুন হার অনুযায়ী ভাড়া হওয়ার কথা ছিল প্রায় ৪৩ টাকা।\n\nচট্টগ্রামে মিনিমাম বাসভাড়া ৩ থেকে ১০ টাকা এবং মিনিবাসে ৩ থেকে ৮ টাকা বেড়েছে। সেখানে বাস ও হিউম্যান হলারের সংকটে যাত্রীদের রাস্তায় অপেক্ষা করতে হচ্ছে বলে প্রতিবেদনে বলা হয়েছে। সিএনজিচালিত পরিবহনের ভাড়া সরকারিভাবে বাড়েনি, তবু কিছু রুটে যাত্রীরা বাড়তি ২ টাকা দিয়েছেন বলে জানিয়েছেন।\n\n> ‘ভাড়া কিলোমিটারপ্রতি ১৭ পয়সা বাড়ার কথা, কিন্তু কোনো বাসই সেটা মানছে না।’ — একজন যাত্রীর অভিযোগ (ঢাকা ট্রিবিউনের প্রতিবেদন অনুযায়ী)\n\n## পরিবহন মালিকদের বক্তব্য\nমালিকদের একটি পক্ষ বলছে, প্রতি ১০০ কিলোমিটারে ডিজেলের বাড়তি খরচ প্রায় ৫৭১ টাকা। তাদের যুক্তি, ভাড়া না বাড়ালে লোকসান হবে। সড়ক পরিবহন মালিক সমিতির একজন নেতা আন্তর্জাতিক জ্বালানি দামের সঙ্গে মিলিয়ে নিয়মিত স্বয়ংক্রিয় ভাড়া সমন্বয়ের দাবি জানিয়েছেন।\n\nঅন্যদিকে যাত্রী কল্যাণ সমিতি ভাড়া পরিবর্তনের প্রক্রিয়া নিয়ে প্রশ্ন তুলেছে। সড়ক পরিবহনমন্ত্রী অতিরিক্ত ভাড়া আদায়কারীদের রুট পারমিট বাতিলের হুঁশিয়ারি দিয়েছেন।\n\n## ভোগান্তি কোথায়\n- **ভাড়া নিয়ে বিভ্রান্তি:** তেলের দাম বাড়ার পর নতুন ভাড়ার তালিকা প্রকাশের আগেই কিছু বাসে বাড়তি ভাড়া চেয়েছে হেলপার-কন্ডাক্টররা। এতে যাত্রীদের সঙ্গে বাগ্বিতণ্ডা হয়েছে।\n- **পণ্য পরিবহনেও চাপ:** ট্রাকের ভাড়াও বাড়ছে। এর প্রভাব শেষ পর্যন্ত বাজারে পণ্যের দামে পড়তে পারে।\n- **নিয়মিত যাতায়াতের খরচ:** প্রতিদিন যাঁরা বাসে অফিস বা কাজে যান, তাঁদের মাসিক খরচ উল্লেখযোগ্য বেড়েছে। একজন যাত্রী দিনে ৫০ থেকে ৬০ টাকা বাড়তি খরচের কথা জানিয়েছেন।\n\n## সামনে কী দেখার আছে\n- সরকারি ভাড়ার তালিকা মানা হচ্ছে কি না, তা মাঠ পর্যায়ে কতটা তদারকি হয়।\n- জ্বালানির দাম বদলালে ভাড়া সমন্বয়ের ধারাবাহিক ও স্বচ্ছ পদ্ধতি তৈরি হয় কি না।\n- যাত্রীরা অভিযোগ জানানোর সহজ ব্যবস্থা পান কি না।\n\n## সূত্র\n- [Dhaka Tribune: Bus fare chaos hits commuters after fuel hike](https://www.dhakatribune.com/bangladesh/dhaka/420525/bus-fare-chaos-hits-commuters-after-fuel-hike)\n- [Dhaka Tribune: Government, transport owners agree to raise bus fares](https://www.dhakatribune.com/bangladesh/420413/government-transport-owners-agree-to-increase-bus)\n- [Dhaka Tribune: Fuel price hike puts fresh pressure on transport, consumers](https://www.dhakatribune.com/bangladesh/power-energy/420379/fuel-price-hike-puts-fresh-pressure-on-transport)\n- [Dhaka Tribune: Fuel price hike pushes up transport fares in Chittagong](https://www.dhakatribune.com/bangladesh/420673/fuel-price-hike-pushes-up-transport-fares-in)\n- [Prothom Alo: Fuel price hike and bus fares](https://en.prothomalo.com/bangladesh/gmk7v0lb3a)", "url": "", "cover": "", "imgs": [], "feat": false, "date": "2026-10-10T12:00:00.000Z"}, {"id": "bus001", "type": "article", "title": "ঢাকার ৯৮ বাস রুট কমে ৩২: ‘এক রুট, এক কোম্পানি’ মডেলে কী বদলাবে?", "cat": "Recent Situation", "author": "Rafsan", "summary": "ডিটিসিএর জরিপে ৪১৮টি অনুমোদিত রুটের মধ্যে চালু আছে মাত্র ৯৮টি। এখন ৩২টি রুটে ‘এক রুটে এক কোম্পানি’ ব্যবস্থা চালুর দিকে এগোচ্ছে কর্তৃপক্ষ।", "body": "ঢাকার গণপরিবহনে বড় ধরনের পরিবর্তনের পথে হাঁটছে ঢাকা পরিবহন সমন্বয় কর্তৃপক্ষ (ডিটিসিএ)। বাস রুট যৌক্তিকীকরণ প্রকল্পের জরিপে দেখা গেছে, রাজধানীতে ৪১৮টি বাস রুট অনুমোদিত থাকলেও বাস্তবে চালু আছে মাত্র ৯৮টি।\n\n## কী ঠিক হয়েছে\n- প্রায় ৬০টি রুট নিয়ে ‘এক রুটে এক কোম্পানি’ (ফ্র্যাঞ্চাইজ) মডেল চালুর কথা ভাবা হচ্ছে।\n- এর মধ্যে ৩২টি রুটে সংশ্লিষ্ট পক্ষগুলোর মধ্যে ঐকমত্য হয়েছে। বাকি রুটের সিদ্ধান্ত পরে চূড়ান্ত হবে।\n- প্রতিটি রুটে বাসের সংখ্যা নির্দিষ্ট থাকবে। ফিটনেস সনদসহ প্রয়োজনীয় কাগজপত্র যাচাইয়ের পরই চলাচল শুরু হবে।\n- বৈধ ফিটনেস সনদ ছাড়া চলা এক হাজারের বেশি বাস দ্রুত সড়ক থেকে সরানোর এবং চালু নেই এমন রুট বাতিলের উদ্যোগ নেওয়ার সিদ্ধান্ত হয়েছে।\n\nফাইন্যান্সিয়াল এক্সপ্রেসের প্রতিবেদন অনুযায়ী, ৩২টি রুটের মধ্যে ১৩টি শহরতলির সঙ্গে যুক্ত এবং ১৯টি শহরের ভেতরে চলবে।\n\n## আগেও হয়েছে চেষ্টা\nধারণাটি নতুন নয়। ২০১৬ সালে তৎকালীন ঢাকা উত্তর সিটি করপোরেশনের মেয়র আনিসুল হক এক কোম্পানির অধীনে বাস চালানোর উদ্যোগ নেন। পরে ২০২১ সালে ‘ঢাকা নগর পরিবহন’ নামে পাইলট রুট চালু হয়। তবে বেসরকারি বাস মালিকদের সাড়া সীমিত ছিল বলে গণমাধ্যমে প্রতিবেদন এসেছে।\n\n## বিশ্লেষকদের সতর্কতা\nফাইন্যান্সিয়াল এক্সপ্রেসের একটি মতামত লেখায় বলা হয়েছে, কেবল কোম্পানির সংখ্যা কমালেই সেবার মান বাড়বে, এমন নিশ্চয়তা নেই। অবৈধ পার্কিং, রুট বদলে চলা, একই পথে একাধিক সেবার জটলা এবং নির্ধারিত স্টপেজ না মানার মতো সমস্যা কমানো জরুরি। রুট এমনভাবে সাজাতে হবে, যাতে অপ্রয়োজনীয় জটলা না থাকে।\n\n## যাত্রীদের জন্য এর মানে কী\nএকই রুটে একজন অপারেটর থাকলে যাত্রী তুলতে চালকদের পাল্লা দেওয়ার প্রবণতা কমতে পারে, যা বেপরোয়া গাড়ি চালানোর অন্যতম কারণ। তবে সব নির্ভর করছে বাস্তবে কতটা কঠোরভাবে নিয়ম মানানো হয় তার ওপর।\n\n## সূত্র\n- [The Financial Express: Dhaka’s bus network may undergo biggest overhaul](https://thefinancialexpress.com.bd/national/dhakas-bus-network-may-undergo-biggest-overhaul)\n- [BSS, ২৫ জুলাই ২০২৬: Buses sans valid documents to be taken off streets soon](https://www.bssnews.net/news/408877)\n- [The Financial Express: Bus operation in city under a franchise-based model](https://thefinancialexpress.com.bd/columns/bus-operation-in-city-under-a-franchise-based-model)\n- [TBS: Plan after plan, a reliable bus service still eludes Dhaka](https://www.tbsnews.net/node/629094)", "url": "", "cover": "", "feat": true, "date": "2026-10-10T09:00:00.000Z"}, {"id": "fran01", "type": "article", "title": "বাস রুট ফ্র্যাঞ্চাইজ মডেল কী, আর শহরের জন্য কেন গুরুত্বপূর্ণ?", "cat": "Analysis", "author": "Rafsan", "summary": "সহজ ভাষায় বোঝা: এক রুটে এক অপারেটর থাকলে কী সুবিধা আসে, আর কোথায় ঝুঁকি থেকে যায়।", "body": "রুট ফ্র্যাঞ্চাইজ মডেলে একটি নির্দিষ্ট রুটে বাস চালানোর অধিকার পায় একটি অনুমোদিত কোম্পানি। কর্তৃপক্ষ ঠিক করে দেয় রুটের নাম বা নম্বর, বাসের সংখ্যা, ভাড়া এবং সেবার মান। অনেক বড় শহরের গণপরিবহন এই কাঠামোতেই চলে।\n\n## সুবিধা কোথায়\n- **কম প্রতিযোগিতা:** একই রুটে অনেক বাস যাত্রীর জন্য পাল্লা দেয় না। এতে বেপরোয়া চালানোর চাপ কমতে পারে।\n- **নির্দিষ্ট সময়সূচি ও সংখ্যা:** কত বাস চলবে আগে থেকেই ঠিক থাকে।\n- **জবাবদিহি:** সমস্যা হলে একটি নির্দিষ্ট কোম্পানিকে দায়ী করা যায়।\n\n## ঝুঁকি কোথায়\n- অপারেটর যদি ভালো সেবা না দেয়, যাত্রীর বিকল্প কমে যায়।\n- নিয়ম মানানোর জন্য শক্ত তদারকি ছাড়া শুধু কাঠামো বদলালে ফল আসে না।\n- বর্তমান বাস মালিক ও শ্রমিকদের স্বার্থ কীভাবে রক্ষা হবে, সেটি আগে থেকে পরিষ্কার থাকা দরকার।\n\n> ভালো পরিকল্পনা যথেষ্ট নয়। মাঠে সেটা মানানোর সক্ষমতাই আসল পরীক্ষা।", "url": "", "cover": "", "feat": false, "date": "2026-10-09T09:00:00.000Z"}, {"id": "news01", "type": "article", "title": "রাজনৈতিক খবর পড়বেন কীভাবে: পাঁচটি সহজ অভ্যাস", "cat": "Opinion", "author": "Rafsan", "summary": "শিরোনাম দেখেই মত তৈরি না করে খবর যাচাইয়ের কয়েকটি ছোট অভ্যাস।", "body": "প্রতিদিন অনেক খবর আর মতামত আমাদের সামনে আসে। সব কিছু যাচাই করা সম্ভব না হলেও কয়েকটি অভ্যাস অনেক ভুল ধারণা থেকে বাঁচায়।\n\n## পাঁচটি অভ্যাস\n- **সূত্র দেখুন:** খবরটি কার কাছ থেকে এসেছে? নাম, দপ্তর বা নথির উল্লেখ আছে কি না দেখুন।\n- **একাধিক জায়গায় মিলিয়ে নিন:** একটি উৎসের ওপর ভরসা না করে দুই-তিনটি ভিন্ন উৎস দেখুন।\n- **খবর আর মতামত আলাদা করুন:** প্রতিবেদন তথ্য জানায়, মতামত লেখকের অবস্থান জানায়।\n- **তারিখ দেখুন:** পুরোনো খবর নতুন করে ছড়ালে ভুল বার্তা তৈরি হয়।\n- **সংখ্যার প্রেক্ষাপট খুঁজুন:** একটি সংখ্যা বড় না ছোট, তা তুলনা ছাড়া বোঝা যায় না।\n\n---\n\nশেয়ার করার আগে একটু থামুন। যাচাই না করা খবর ছড়ানোর চেয়ে অপেক্ষা করা ভালো।", "url": "", "cover": "", "feat": false, "date": "2026-10-08T09:00:00.000Z"}], "pc": "321aee9340dbce85da0f94713e4ba504b972af366d110a992c05bdb14efb9931"}</script>
